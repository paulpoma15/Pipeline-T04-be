# kubectl apply -f paul-poma-11-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paul-poma-11-deployment
  namespace: paul-poma-11-namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: paul-poma-11-deployment        # Debe coincidir con las etiquetas del Service
  template:
    metadata:
      labels:
        app: paul-poma-11-deployment      # Debe coincidir con las etiquetas del Service
    spec:
      containers:
      - name: paul-poma-11-container
        image: paulpoma15/webflux-nosql:2.0   # Reemplaza con tu imagen Docker Hub
        imagePullPolicy: IfNotPresent        # Evitar traer siempre la última versión si hay una actual
        envFrom:
        - secretRef:
            name: paul-poma-11-secret  # Esto cargará todos los valores como variables de entorno