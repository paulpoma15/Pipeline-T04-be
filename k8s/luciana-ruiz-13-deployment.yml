# kubectl apply -f luciana-ruiz-13-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luciana-ruiz-13-deployment
  namespace: luciana-ruiz-13-namespace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: luciana-ruiz-13-deployment        # Debe coincidir con las etiquetas del Service
  template:
    metadata:
      labels:
        app: luciana-ruiz-13-deployment      # Debe coincidir con las etiquetas del Service
    spec:
      containers:
      - name: luciana-ruiz-13-container
        image: lucisof/lucianaruiz-webflux-app:1.1   # Reemplaza con tu imagen Docker Hub
        imagePullPolicy: IfNotPresent        # Evitar traer siempre la última versión si hay una actual
        #envFrom:
        #- secretRef:
        #    name: luciana-ruiz-13-secret  # Esto cargará todos los valores como variables de entorno